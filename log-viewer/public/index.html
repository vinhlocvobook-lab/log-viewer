<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFriend Log Viewer (Analytics)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .thinking-block { border-left: 3px solid #4b5563; font-style: italic; color: #9ca3af; margin: 10px 0; }
        .tool-call { background: #1e1b4b; border: 1px solid #312e81; font-family: monospace; padding: 10px; border-radius: 8px; margin: 10px 0; }
        .tool-result { background: #064e3b; border: 1px solid #065f46; font-family: monospace; padding: 10px; border-radius: 8px; margin: 10px 0; color: #10b981; }
        .system-event { background: #451a03; border: 1px solid #78350f; color: #fbbf24; padding: 8px; border-radius: 8px; font-size: 0.75rem; margin: 10px 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">
    <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black flex items-center gap-2 tracking-tighter">
                📜 DEV_LOGS <span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold uppercase">Analytics</span>
            </h1>
            <div id="usage-summary" class="flex gap-6 text-xs font-mono text-gray-400"></div>
            <div class="flex gap-4">
                <button id="show-system-btn" class="text-xs bg-gray-800 border border-gray-700 hover:bg-gray-700 px-3 py-1 rounded-lg transition">Brain Context</button>
                <button id="logout-btn" class="text-xs text-gray-500 hover:text-white">Logout</button>
            </div>
        </div>
    </nav>

    <div id="system-modal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[200] p-10">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-5xl max-h-full flex flex-col overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-black/20">
                <h2 class="font-bold text-blue-400">System Prompt & Context</h2>
                <button onclick="document.getElementById('system-modal').style.display='none'" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="system-content" class="p-8 overflow-y-auto font-mono text-xs leading-relaxed whitespace-pre-wrap text-gray-400 bg-black/40"></div>
        </div>
    </div>

    <main id="main-content" class="max-w-7xl mx-auto p-6" style="display:none;">
        <!-- Analytics Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2 bg-gray-900/50 border border-gray-800 p-6 rounded-3xl shadow-xl">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Token Growth</h3>
                <div class="h-48 w-full">
                    <canvas id="usageChart"></canvas>
                </div>
            </div>
            <div class="bg-gray-900/50 border border-gray-800 p-6 rounded-3xl shadow-xl flex flex-col justify-center">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 text-center">Active Model</h3>
                <div id="model-name" class="text-2xl font-black text-center text-blue-500 mb-4">...</div>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-black/30 p-3 rounded-2xl border border-gray-800">
                        <div class="text-[10px] text-gray-500 font-bold uppercase">Input</div>
                        <div id="tokens-in" class="text-lg font-mono font-bold">0</div>
                    </div>
                    <div class="bg-black/30 p-3 rounded-2xl border border-gray-800">
                        <div class="text-[10px] text-gray-500 font-bold uppercase">Output</div>
                        <div id="tokens-out" class="text-lg font-mono font-bold">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Logs Row -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
            <section class="xl:col-span-4">
                <h2 class="text-sm uppercase tracking-widest font-bold mb-4 text-blue-500">Project Timeline</h2>
                <div id="project-log" class="bg-gray-900/30 p-6 rounded-3xl border border-gray-800 overflow-y-auto max-h-[60vh] prose prose-invert prose-sm max-w-none shadow-inner custom-scrollbar">
                    Loading...
                </div>
            </section>

            <section class="xl:col-span-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm uppercase tracking-widest font-bold text-purple-500">Live AI Stream</h2>
                    <input type="text" id="search-box" placeholder="Filter interactions..." class="bg-gray-900 border border-gray-800 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all w-64">
                </div>
                <div id="llm-log" class="space-y-6 overflow-y-auto max-h-[60vh] pr-4 custom-scrollbar">
                    Initializing feed...
                </div>
            </section>
        </div>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-gray-950 flex items-center justify-center z-[100]" style="display:none;">
        <div class="bg-gray-900 p-10 rounded-3xl border border-gray-800 w-96 shadow-2xl">
            <div class="text-4xl mb-6 text-center">🛡️</div>
            <h3 class="text-xl font-black mb-2 text-center">Log Access</h3>
            <p class="text-gray-500 text-xs text-center mb-8">Unauthorized access is restricted</p>
            <input type="password" id="access-key-input" placeholder="ACCESS_KEY" class="w-full bg-black border border-gray-800 rounded-xl p-4 mb-6 text-center tracking-widest focus:border-blue-600 outline-none transition-all">
            <button id="save-key-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-black uppercase tracking-widest transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-blue-900/20">Authenticate</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const searchBox = document.getElementById('search-box');
        const authModal = document.getElementById('auth-modal');
        const mainContent = document.getElementById('main-content');
        const systemModal = document.getElementById('system-modal');
        let currentSearch = '';
        let lastSystemPrompt = '';
        let usageChart = null;

        function getHeaders() { return { 'x-access-key': localStorage.getItem('log_access_key') }; }

        function renderContent(item) {
            if (item.type === 'text') return `<div class="text-sm leading-relaxed text-gray-300">${marked.parse(item.text)}</div>`;
            if (item.type === 'thinking') return `<div class="thinking-block pl-4 text-xs italic text-gray-500">${marked.parse(item.thinking)}</div>`;
            if (item.type === 'toolCall') return `<div class="tool-call"><div class="text-[9px] text-blue-400 font-black mb-2 tracking-widest uppercase">TOOL_EXEC: ${item.name}</div><pre class="text-[11px] text-blue-100/80 overflow-x-auto">${JSON.stringify(item.arguments, null, 2)}</pre></div>`;
            if (item.type === 'toolResult') return `<div class="tool-result"><div class="text-[9px] text-green-400 font-black mb-2 tracking-widest uppercase">TERMINAL_OUT: ${item.toolName}</div><div class="text-xs font-mono break-all">${item.text}</div></div>`;
            return '';
        }

        function updateChart(history) {
            const data = history.map(h => h.total_tokens);
            const labels = history.map(h => new Date(h.timestamp).toLocaleTimeString());
            
            if (usageChart) {
                usageChart.data.labels = labels;
                usageChart.data.datasets[0].data = data;
                usageChart.update('none');
                return;
            }

            const ctx = document.getElementById('usageChart').getContext('2d');
            usageChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => ""),
                    datasets: [{
                        label: 'Total Tokens',
                        data: data,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { 
                            grid: { color: '#1f2937' },
                            ticks: { color: '#4b5563', font: { size: 9 } }
                        }
                    }
                }
            });
        }

        async function loadData() {
            const key = localStorage.getItem('log_access_key');
            if (!key) { authModal.style.display = 'flex'; return; }

            try {
                const usageRes = await fetch(`/api/logs/usage`, { headers: getHeaders() });
                if (usageRes.status === 403) throw new Error("Auth failed");
                const usageData = await usageRes.json();
                
                const current = usageData.current;
                document.getElementById('model-name').textContent = current.model;
                document.getElementById('tokens-in').textContent = (current.inputTokens/1000).toFixed(1) + 'k';
                document.getElementById('tokens-out').textContent = (current.outputTokens/1000).toFixed(1) + 'k';
                lastSystemPrompt = current.systemPrompt;

                updateChart(usageData.history);

                const projectRes = await fetch(`/api/logs/project`, { headers: getHeaders() });
                const project = await projectRes.json();
                document.getElementById('project-log').innerHTML = marked.parse(project.content);

                const llmRes = await fetch(`/api/logs/llm?q=${encodeURIComponent(currentSearch)}`, { headers: getHeaders() });
                const history = await llmRes.json();
                
                document.getElementById('llm-log').innerHTML = history.map(msg => {
                    let roleClass = "border-gray-800 bg-gray-900/30";
                    let label = msg.role.toUpperCase();
                    let labelColor = "text-gray-500";
                    
                    if (msg.role === 'user') { roleClass = "border-blue-900/30 bg-blue-900/5 ring-1 ring-blue-500/10"; label = "👤 HUMAN_REQUEST"; labelColor = "text-blue-400"; }
                    if (msg.role === 'system') { roleClass = "border-yellow-900/20 bg-yellow-950/5"; label = "⚙️ SYSTEM_EVENT"; labelColor = "text-yellow-500"; }
                    if (msg.role === 'toolResult') { roleClass = "border-green-900/20 bg-green-950/5"; label = "✅ TOOL_RESULT"; labelColor = "text-green-500"; }
                    if (msg.role === 'assistant') { label = "🤖 AI_RESPONSE"; labelColor = "text-purple-400"; }

                    return `
                        <div class="p-6 rounded-3xl border ${roleClass} transition-all hover:border-gray-700 shadow-sm">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-[9px] uppercase font-black tracking-widest ${labelColor}">${label}</span>
                                <span class="text-[9px] text-gray-600 font-mono">${new Date(msg.timestamp).toLocaleString()}</span>
                            </div>
                            <div class="space-y-3">${msg.content.map(renderContent).join('')}</div>
                        </div>
                    `;
                }).join('');

                mainContent.style.display = 'block';
                authModal.style.display = 'none';
            } catch (e) {
                authModal.style.display = 'flex';
                mainContent.style.display = 'none';
            }
        }

        document.getElementById('save-key-btn').onclick = () => {
            localStorage.setItem('log_access_key', document.getElementById('access-key-input').value);
            loadData();
        };

        document.getElementById('logout-btn').onclick = () => {
            localStorage.removeItem('log_access_key');
            location.reload();
        };

        document.getElementById('show-system-btn').onclick = () => {
            document.getElementById('system-content').textContent = lastSystemPrompt;
            systemModal.style.display = 'flex';
        };

        searchBox.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            loadData();
        });

        loadData();
        setInterval(loadData, 15000);
    </script>
</body>
</html>
