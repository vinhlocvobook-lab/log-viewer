<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFriend Log Viewer (SQLite)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                📜 Log Viewer <span class="text-xs bg-blue-600 px-2 py-1 rounded">SQLITE</span>
            </h1>
            <div id="usage-stats" class="flex gap-4 text-sm text-gray-400">
                <!-- Usage stats will load here -->
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Project Audit Log -->
        <section>
            <h2 class="text-lg font-semibold mb-4 text-blue-400">Audit Log (Markdown)</h2>
            <div id="project-log" class="bg-gray-800 p-6 rounded-xl border border-gray-700 overflow-y-auto max-h-[700px] prose prose-invert max-w-none">
                Loading...
            </div>
        </section>

        <!-- LLM Interaction Log -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-purple-400">LLM Interactions</h2>
                <input type="text" id="search-box" placeholder="Search logs..." class="bg-gray-800 border border-gray-700 rounded px-3 py-1 text-sm focus:outline-none focus:border-purple-500">
            </div>
            <div id="llm-log" class="space-y-4 overflow-y-auto max-h-[700px] pr-2">
                Loading...
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const searchBox = document.getElementById('search-box');
        let currentSearch = '';

        async function loadData() {
            try {
                // Load Stats
                const usageRes = await fetch('/api/logs/usage');
                const usage = await usageRes.json();
                document.getElementById('usage-stats').innerHTML = `
                    <span>Model: <b>${usage.model}</b></span>
                    <span>Total Tokens: <b>${(usage.totalTokens/1000).toFixed(1)}k</b></span>
                `;

                // Load Project Log
                const projectRes = await fetch('/api/logs/project');
                const project = await projectRes.json();
                document.getElementById('project-log').innerHTML = marked.parse(project.content);

                // Load LLM History
                const llmRes = await fetch(`/api/logs/llm?q=${encodeURIComponent(currentSearch)}`);
                const history = await llmRes.json();
                const llmContainer = document.getElementById('llm-log');
                llmContainer.innerHTML = history.map(msg => `
                    <div class="p-4 rounded-lg border ${msg.role === 'user' ? 'bg-gray-800 border-blue-900' : 'bg-gray-700 border-purple-900'}">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs uppercase font-bold tracking-wider ${msg.role === 'user' ? 'text-blue-400' : 'text-purple-400'}">
                                ${msg.role}
                            </span>
                            <span class="text-[10px] text-gray-500">${new Date(msg.timestamp).toLocaleString()}</span>
                        </div>
                        <div class="text-sm whitespace-pre-wrap font-mono">${msg.text.substring(0, 1000)}${msg.text.length > 1000 ? '...' : ''}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Failed to load logs", e);
            }
        }

        searchBox.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            loadData();
        });

        loadData();
        setInterval(loadData, 30000); // Auto-refresh every 30s
    </script>
</body>
</html>
