<VirtualHost *:80>
    ServerName logs.local
    # Listen on port 8080 or use a different virtualhost for the logs
</VirtualHost>

# Since we already have 000-default.conf for the TodoList on port 80, 
# I will set the Log Viewer to run on port 8080.
Listen 8080
<VirtualHost *:8080>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
